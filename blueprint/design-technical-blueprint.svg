<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Hand-drawn UI and UX design blueprint</title>
  <desc id="desc">A blue graph-paper board with hand-drawn website wireframes, interface components, and responsive mobile sketches.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7fb4cf" stroke-width="1" opacity=".36"/>
      <path d="M160 0H0V160" fill="none" stroke="#4f8faf" stroke-width="2" opacity=".2"/>
    </pattern>
    <filter id="paperShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#17364d" flood-opacity=".35"/>
    </filter>
    <style>
      .ink { fill: none; stroke: #164f70; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #326f90; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
      .faint { fill: none; stroke: #659db7; stroke-width: 2; stroke-linecap: round; }
      .label { fill: #164f70; font-family: "Comic Sans MS", "Segoe Print", cursive; font-weight: 700; }
      .note { fill: #326f90; font-family: "Comic Sans MS", "Segoe Print", cursive; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#d9f0f7"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <path d="M90 105C280 79 472 104 641 88S1047 80 1495 106" class="ink"/>
  <text x="108" y="76" class="label" font-size="40">Nexora UI / UX — sketch board</text>
  <text x="1130" y="77" class="note" font-size="21">rough wireframe ideas</text>

  <!-- Desktop landing-page wireframe -->
  <g filter="url(#paperShadow)">
    <path d="M107 171C104 156 116 147 131 149L770 146C787 148 792 157 791 174L796 574C793 588 783 593 768 591L125 593C111 589 106 579 108 564Z" fill="#effaff" stroke="#164f70" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <text x="125" y="137" class="label" font-size="24">desktop / home</text>
  <path d="M126 190C285 184 551 188 768 189" class="ink"/>
  <path d="M143 213H255M524 213H579M605 213H655M681 213H740" class="thin"/>
  <circle cx="145" cy="212" r="7" fill="#164f70"/>
  <path d="M132 254C272 246 421 248 478 256L470 409C354 401 236 405 132 410Z" fill="#c8e8f4" stroke="#164f70" stroke-width="3"/>
  <path d="M154 279C227 267 359 273 432 278M154 305C232 297 382 301 445 305M154 330C215 322 322 327 370 331" class="thin"/>
  <path d="M154 367C219 359 292 363 340 370L340 392L154 393Z" fill="#8ec9df" stroke="#164f70" stroke-width="3"/>
  <path d="M505 255C591 240 718 255 756 285L754 407C661 394 575 404 503 409Z" fill="#acdceb" stroke="#164f70" stroke-width="3"/>
  <circle cx="629" cy="329" r="57" fill="none" stroke="#326f90" stroke-width="3"/>
  <path d="M588 347C609 309 639 295 675 304M593 365C633 379 662 371 687 342" class="thin"/>
  <path d="M132 449C205 440 283 444 351 451L347 558C271 552 199 556 132 558ZM377 449C449 439 529 445 594 451L592 558C514 551 446 556 377 558ZM621 449C668 440 722 446 758 451L759 558C712 552 664 556 621 558Z" fill="#e2f4fa" stroke="#164f70" stroke-width="3"/>
  <path d="M152 475H315M152 498H278M397 475H567M397 498H530M641 475H737M641 498H713" class="faint"/>

  <!-- Loose annotation marks: visual only, no explanatory process prose -->
  <path d="M83 312C56 312 57 279 82 275M82 275L70 265M82 275L68 285" class="thin"/>
  <text x="20" y="253" class="note" font-size="20" transform="rotate(-7 20 253)">hero</text>
  <path d="M298 618C323 640 347 642 368 625" class="thin"/>
  <text x="284" y="666" class="note" font-size="20" transform="rotate(4 284 666)">cards</text>

  <!-- Component scraps -->
  <g transform="translate(871 153) rotate(2)">
    <path d="M12 7L372 0L380 224L5 230Z" fill="#fff9c9" stroke="#164f70" stroke-width="3"/>
    <text x="31" y="43" class="label" font-size="23">little UI pieces</text>
    <path d="M32 68C92 61 153 64 215 68L215 103C151 100 88 104 32 105Z" fill="#c1e5f1" stroke="#164f70" stroke-width="3"/>
    <path d="M32 126C118 120 205 124 321 129L319 179C215 172 115 177 32 179Z" fill="#e8f8fc" stroke="#164f70" stroke-width="3"/>
    <circle cx="55" cy="152" r="12" fill="#8ec9df" stroke="#164f70" stroke-width="3"/>
    <path d="M80 145H280M80 163H236" class="thin"/>
    <path d="M254 70C291 63 329 66 348 73L348 104C318 99 283 104 254 105Z" fill="#8ec9df" stroke="#164f70" stroke-width="3"/>
  </g>

  <!-- Course/detail page sketch -->
  <g transform="translate(885 440) rotate(-1)">
    <path d="M4 7C81 2 380 0 529 10L526 365C371 357 151 364 6 357Z" fill="#f2fbff" stroke="#164f70" stroke-width="4"/>
    <path d="M25 34C191 29 356 31 506 35" class="ink"/>
