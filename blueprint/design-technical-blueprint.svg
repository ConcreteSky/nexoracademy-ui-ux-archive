    <path d="M31 104C144 94 228 101 258 109L256 210C170 204 101 207 31 211Z" fill="#bce2ef" stroke="#164f70" stroke-width="3"/>
    <path d="M280 105C365 97 444 100 499 110L499 210C412 200 352 205 280 210Z" fill="#e1f4fa" stroke="#164f70" stroke-width="3"/>
    <path d="M298 132H473M298 155H440M298 178H410" class="thin"/>
    <path d="M32 247C133 238 252 243 498 250M32 276C143 268 304 270 461 278M32 305C155 296 317 302 428 308" class="thin"/>
    <path d="M32 328C90 320 166 324 219 330L219 350L32 350Z" fill="#8ec9df" stroke="#164f70" stroke-width="3"/>
  </g>
  <text x="904" y="424" class="label" font-size="24">course detail</text>

  <!-- Mobile responsive sketches -->
  <g transform="translate(176 715) rotate(-2)">
    <path d="M5 0C56 -5 115 -4 143 3L147 242C105 247 52 245 4 240Z" fill="#effaff" stroke="#164f70" stroke-width="4"/>
    <rect x="59" y="12" width="34" height="6" rx="3" fill="#164f70"/>
    <path d="M20 39H129M20 58H92" class="thin"/>
    <path d="M20 78C54 72 103 76 129 83L129 139C88 135 54 137 20 139Z" fill="#bce2ef" stroke="#164f70" stroke-width="3"/>
    <path d="M20 160C54 154 103 157 129 164L129 211C91 207 50 209 20 211Z" fill="#e2f4fa" stroke="#164f70" stroke-width="3"/>
    <circle cx="76" cy="227" r="5" fill="#164f70"/>
  </g>
  <g transform="translate(355 715) rotate(3)">
    <path d="M5 0C56 -5 115 -4 143 3L147 242C105 247 52 245 4 240Z" fill="#effaff" stroke="#164f70" stroke-width="4"/>
    <rect x="59" y="12" width="34" height="6" rx="3" fill="#164f70"/>
    <path d="M20 39H129" class="thin"/>
    <path d="M20 64C54 58 101 62 129 68L129 99C87 95 52 97 20 99Z" fill="#8ec9df" stroke="#164f70" stroke-width="3"/>
    <path d="M20 121H129M20 142H115M20 163H121" class="thin"/>
    <path d="M20 184C54 178 101 182 129 188L129 211C90 207 52 209 20 211Z" fill="#bce2ef" stroke="#164f70" stroke-width="3"/>
    <circle cx="76" cy="227" r="5" fill="#164f70"/>
  </g>
  <text x="168" y="986" class="note" font-size="22">small screen check</text>

  <!-- hand-drawn decorative tape and design marks -->
  <path d="M697 675l117 -14 8 45-117 14z" fill="#b9dce7" opacity=".8" transform="rotate(-8 755 683)"/>
  <path d="M825 866c49-25 101-28 147-4M973 862l-14-13M973 862l-18 10" class="thin"/>
  <text x="1038" y="898" class="note" font-size="21" transform="rotate(3 1038 898)">mobile + desktop</text>
  <path d="M1110 911C1257 934 1390 922 1497 894" class="ink"/>
  <text x="1130" y="965" class="label" font-size="28">UI / UX wireframe blueprint</text>
</svg>
